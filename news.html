<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>News — Wheely Good Tutoring</title>
  <meta name="description" content="Announcements and updates from Wheely Good Tutoring, newest first.">

  <!-- Open Graph (per page) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="News — Wheely Good Tutoring">
  <meta property="og:description" content="Announcements and updates from Wheely Good Tutoring, newest first.">
  <meta property="og:image" content="assets/logo.svg">

  <!-- Favicon (relative, every page) -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- EXACT inline theme script: must run before the stylesheet link / before first paint -->
  <script>
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved ?? (prefersDark ? 'dark' : 'light');
  </script>

  <!-- Optional progressive-enhancement font (ONLY allowed external dependency). System stack is the fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">

  <!-- page scripts: non-render-blocking. layout + theme on every page; render.js only where needed -->
  <script src="js/layout.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script type="module" src="js/render.js"></script>
</head>
