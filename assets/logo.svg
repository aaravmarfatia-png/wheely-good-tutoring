<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" role="img" aria-labelledby="logo-title" fill="none">
  <title id="logo-title">Wheely Good Tutoring</title>
  <!-- Wheel icon: circle with spokes, uses currentColor so it adapts to theme -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="24" cy="24" r="17"/>
    <circle cx="24" cy="24" r="4"/>
    <line x1="24" y1="7" x2="24" y2="20"/>
    <line x1="24" y1="28" x2="24" y2="41"/>
    <line x1="7" y1="24" x2="20" y2="24"/>
    <line x1="28" y1="24" x2="41" y2="24"/>
    <line x1="12" y1="12" x2="21" y2="21"/>
    <line x1="27" y1="27" x2="36" y2="36"/>
    <line x1="36" y1="12" x2="27" y2="21"/>
    <line x1="21" y1="27" x2="12" y2="36"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="30" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="currentColor">Wheely Good Tutoring</text>
</svg>
